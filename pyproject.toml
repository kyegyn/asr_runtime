[project]
name = "asr-runtime"
version = "0.1.0"
description = "Standalone Windows runtime for Silero VAD, SenseVoiceSmall and CAM++"
requires-python = ">=3.11,<3.13"
dependencies = [
  "addict>=2.4.0",
  "funasr>=1.4.0",
  "modelscope>=1.20.0",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20.0",
  "opencc-python-reimplemented>=0.1.7",
  "pyyaml>=6.0",
  "scipy>=1.13.0",
  "sounddevice>=0.5.0",
  "soundfile>=0.12.1",
  "torch>=2.7.0",
  "torchaudio>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.uv]
package = false
required-version = ">=0.8"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

